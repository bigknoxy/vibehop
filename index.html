<script>
(() => {
  // --- 1. DRY Utilities: Storage, Math, Seeded PRNG, Haptics & PWA ---
  const posMod = (n, m) => ((n % m) + m) % m;
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const Storage = {
    getInt(key, fallback = 0) {
      try {
        const val = parseInt(localStorage.getItem(key), 10);
        return Number.isNaN(val) ? fallback : val;
      } catch (_) { return fallback; }
    },
    set(key, val) {
      try { localStorage.setItem(key, String(val)); } catch (_) {}
    }
  };

  // VH-13: Deterministic Mulberry32 PRNG for Daily Seeded Runs
  function createMulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function getTodaySeedInt() {
    const d = new Date();
    return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate();
  }

  const triggerHaptic = (pattern) => {
    try {
      if (navigator && typeof navigator.vibrate === 'function') navigator.vibrate(pattern);
    } catch (_) {}
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  let deferredPrompt = null;
  const installBtn = document.getElementById('install-btn');
  const iosTip = document.getElementById('ios-tip');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });

  installBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });

  if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream &&
      !(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true)) {
    iosTip.style.display = 'block';
  }

  // --- 2. VH-07 & VH-11: Unlockable Cassette Biomes & Avatar Geometries ---
  const THEMES = [
    {
      name: 'Midnight Mint', bpm: 115, unlockRank: 1,
      bg: '#0d0e1e', mint: '#4ef0d0', magenta: '#ff5376', amber: '#ffd166',
      pentatonic: [261.63, 311.13, 349.23, 392.00, 466.16, 523.25, 622.25],

        [261.63, 311.13, 392.00, 466.16], [207.65, 261.63, 311.13, 392.00],

    {

      bg: '#160c24', mint: '#ff7eb6', magenta: '#42d6ff', amber: '#ffe07d',
      pentatonic: [293.66, 349.23, 392.00, 440.00, 523.25, 587.33, 698.46],
      chords: [
        [293.66, 349.23, 440.00, 523.25], [233.08, 293.66, 349.23, 440.00],
        [196.00, 233.08, 293.66, 392.00], [220.00, 261.63, 329.63, 392.00]
      ]
    },
    {
      name: 'Amber Dusk', bpm: 120, unlockRank: 3,
      bg: '#1b100e', mint: '#ffb703', magenta: '#fb5607', amber: '#8ecae6',
      pentatonic: [246.94, 293.66, 329.63, 369.99, 440.00, 493.88, 587.33],
      chords: [
        [246.94, 293.66, 369.99, 440.00], [196.00, 246.94, 293.66, 369.99],
        [164.81, 196.00, 246.94, 329.63], [185.00, 220.00, 277.18, 329.63]
      ]
    },
    {
      name: 'Matcha Rain', bpm: 106, unlockRank: 4,
      bg: '#0a1915', mint: '#80ed99', magenta: '#38a3a5', amber: '#f6f7d4',
      pentatonic: [220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25],
      chords: [
        [220.00, 261.63, 329.63, 392.00], [174.61, 220.00, 261.63, 329.63],
        [146.83, 174.61, 220.00, 293.66], [164.81, 196.00, 246.94, 293.63]
      ]
    }
  ];

  const AVATARS = [
    { id: 'cube', name: 'Neon Cube', icon: '◻', unlockRank: 1 },
    { id: 'vinyl', name: 'Vinyl Disc', icon: '◎', unlockRank: 2 },
    { id: 'star', name: 'Shuriken', icon: '✦', unlockRank: 3 },
    { id: 'hex', name: 'Cyber Hex', icon: '⬡', unlockRank: 4 }
  ];

  const COLORS = { ...THEMES[0] };

  // --- 3. Web Audio Synthesizer (Master Muffle Filter + Mute + Dynamic Stems) ---
  class LoFiAudio {
    constructor(getState) {
      this.getState = getState;
      this.ctx = null;
      this.masterFilter = null;
      this.masterGain = null;
      this.isPlaying = false;
      this.anchorTime = 0;
      this.forcedBeatPhase = null;
      this.noiseBuffer = null;
      this.step = 0;
      this.nextNoteTime = 0;
      this.applyTheme(THEMES[0]);
    }

    applyTheme(theme) {
      this.bpm = theme.bpm;
      this.stepTime = (60 / this.bpm) / 2;
      this.pentatonic = theme.pentatonic;
      this.chords = theme.chords;
    }

    getTargetFilterFreq(mult = 1) {
      const clamped = Math.max(1, Math.min(8, mult));
      return Math.round(680 + ((clamped - 1) / 7) * 1820);
    }

    // VH-15: Master Low-Pass Filter Target (Underwater Muffle on Overlay/Paused)
    getMasterFilterTarget(mode) {
      return mode === 'PLAY' ? 18000 : 420;
    }

    getMasterGainValue() {
      return this. getState().muted ? 0 : 0.9;
    }

    syncMasterChain() {
      if (!this.ctx || !this.masterGain || !this.masterFilter) return;
      const now = this.ctx.currentTime;
      const st = this.getState();
      const targetGain = this.getMasterGainValue();
      const targetCutoff = this.getMasterFilterTarget(st.mode);
      this.masterGain.gain.setTargetAtTime(targetGain, now, 0.03);
      this.masterFilter.frequency.setTargetAtTime(targetCutoff, now, 0.08);
    }

    isArpActive(mult = 1) {
      return mult >= 5;
    }

    forceBeatOffset(phase) {
      this.forcedBeatPhase = phase;
    }

    getBeatPhase() {
      if (typeof this.forcedBeatPhase === 'number') return this.forcedBeatPhase;
      const beatDur = 60 / this.bpm;
      const now = this.ctx ? this.ctx.currentTime : performance.now() / 1000;
      return (Math.max(0, now - this.anchorTime) % beatDur) / beatDur;
    }

    isOnBeat() {
      const phase = this.getBeatPhase();
      return phase <= 0.22 || phase >= 0.78;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        this.masterFilter = this.ctx.createBiquadFilter();
        this.masterFilter.type = 'lowpass';
        this.masterFilter.frequency.setValueAtTime(18000, this.ctx.currentTime);
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.setValueAtTime(this.getMasterGainValue(), this.ctx.currentTime);
        this.masterFilter.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);

        const len = Math.floor(this.ctx.sampleRate * 0.2);
        this.noiseBuffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      this.syncMasterChain();
      if (!this.isPlaying) {
        this.isPlaying = true;
        this.anchorTime = this.ctx.currentTime;
        this.nextNoteTime = this.ctx.currentTime + 0.04;
        this.schedule();
      }
    }

    playTone({ type = 'sine', freq, endFreq, time, duration, gainPeak = 0.14, filterFreq = 0 }) {
      if (!this.ctx || this.getState().muted) return;
      const dest = this.masterFilter || this.ctx.destination;
      const t = time ?? this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + duration * 0.85);

      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(gainPeak, t + Math.min(0.02, duration * 0.2));
      gain.gain.exponentialRampToValueAtTime(0.0008, t + duration);

      if (filterFreq > 0) {
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(filterFreq, t);
        osc.connect(filter);
        filter.connect(gain);
      } else {
        osc.connect(gain);
      }
      gain.connect(dest);
      osc.start(t);
      osc.stop(t + duration + 0.01);
    }

    playNoise({ filterType, filterFreq, gainPeak, duration, time }) {
      if (!this.ctx || !this.noiseBuffer || this.getState().muted) return;
      const dest = this.masterFilter || this.ctx.destination;
      const t = time ?? this.ctx.currentTime;
      const noise = this.ctx.createBufferSource();
      noise.buffer = this.noiseBuffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.setValueAtTime(filterFreq, t);
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(gainPeak, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(dest);
      noise.start(t, 0, duration);
    }

    schedule() {
      if (!this.isPlaying || !this.ctx) return;
      if (document.hidden || this.getState().muted) {
        this.nextNoteTime = this.ctx.currentTime + 0.1;
      } else {
        if (this.nextNoteTime < this.ctx.currentTime - 0.25) {
          this.nextNoteTime = this.ctx.currentTime + 0.04;
        }
        while (this.nextNoteTime < this.ctx.currentTime + 0.12) {
          this.playStep(this.step, this.nextNoteTime);
          this.nextNoteTime += this.stepTime;
          this.step = (this.step + 1) % 32;
        }
      }
      setTimeout(() => this.schedule(), 40);
    }

    playStep(step, time) {
      const { mult = 1, mode = 'START' } = this.getState();
      const cutoff = this.getTargetFilterFreq(mult);

      if (step % 8 === 0) {
        const chord = this.chords[Math.floor(step / 8) % this.chords.length];
        chord.forEach((freq) =>
          this.playTone({
            type: 'triangle', freq, time,
            duration: this.stepTime * 7.8, gainPeak: 0.032, filterFreq: cutoff
          })
        );
      }

      if (step % 8 === 0 || step % 8 === 3 || step % 8 === 4) {
        this.playTone({ freq: 125, endFreq: 42, time, duration: 0.18, gainPeak: 0.22 });
      }
      if (step % 4 === 2 && (mode === 'PLAY' || mult >= 2)) {
        this.playNoise({ filterType: 'bandpass', filterFreq: 1400, gainPeak: 0.08, duration: 0.09, time });
      }
      if (mult >= 2 || step % 2 === 0) {
        this.playNoise({ filterType: 'highpass', filterFreq: 6500, gainPeak: step % 2 ? 0.017 : 0.009, duration: 0.035, time });
      }
      if (this.isArpActive(mult)) {
        const arpFreq = this.pentatonic[(step * 2) % this.pentatonic.length] * 1.5;
        this.playTone({ type: 'sine', freq: arpFreq, time, duration: this.stepTime * 0.9, gainPeak: 0.028 });
      }
    }

    sfxJump(noteIndex = 0, isPerfect = false) {
      const freq = this.pentatonic[noteIndex % this.pentatonic.length];
      this.playTone({
        type: isPerfect ? 'triangle' : 'sine',
        freq, endFreq: freq * (isPerfect ? 1.5 : 1.25),
        duration: 0.16, gainPeak: isPerfect ? 0.17 : 0.13
      });
    }

    sfxDash() {
      if (!this.ctx) return;
      [523.25, 622.25, 783.99].forEach((freq, i) =>
        this.playTone({ type: 'triangle', freq, time: this.ctx.currentTime + i * 0.035, duration: 0.18, gainPeak: 0.12 })
      );
    }

    sfxOrb() {
      if (!this.ctx) return;
      [622.25, 932.33].forEach((freq, i) =>
        this.playTone({ type: 'sine', freq, time: this.ctx.currentTime + i * 0.05, duration: 0.22, gainPeak: 0.14 })
      );
    }

    sfxGraze() {
      this.playTone({ type: 'sine', freq: 880, endFreq: 1174.66, duration: 0.09, gainPeak: 0.09 });
    }

    sfxShieldBreak() {
      this.playTone({ type: 'sawtooth', freq: 190, endFreq: 65, duration: 0.3, gainPeak: 0.15 });
    }
  }

  function generateMissionsSet(seedOffset = 0) {
    const start = (state.vibeRank + seedOffset) % MISSION_TEMPLATES.length;
    activeMissions = [0, 1, 2].map((i) => ({
      ...MISSION_TEMPLATES[(start + i * 2) % MISSION_TEMPLATES.length],
      progress: 0,
      done: false
    }));
    renderMissionsDOM();
  }

  function recordMissionProgress(type, amount = 1, isAbsolute = false) {
    let completedAny = false;
    activeMissions.forEach((m) => {
      if (m.type === type && !m.done) {
        m.progress = isAbsolute ? Math.max(m.progress, amount) : m.progress + amount;
        if (m.progress >= m.target) {
          m.progress = m.target;
          m.done = true;
          completedAny = true;
        }
      }
    });
    if (completedAny) {
      spawnFloatingText(player.x, player.y - 36, '📼 GOAL COMPLETE!', COLORS.mint);
      if (activeMissions.every((m) => m.done)) {
        setVibeRank(state.vibeRank + 1);

  function selectTheme(idx) {
    const safeIdx = posMod(idx, THEMES.length);
    const t = THEMES[safeIdx];
    if (state.vibeRank < t.unlockRank) return false;
    state.themeIdx = safeIdx;
    Object.assign(COLORS, { bg: t.bg, mint: t.mint, magenta: t.magenta, amber: t.amber });
    const rootStyle = document.documentElement.style;
    rootStyle.setProperty('--bg', t.bg);
    rootStyle.setProperty('--mint', t.mint);
    rootStyle.setProperty('--magenta', t.magenta);
    rootStyle.setProperty('--amber', t.amber);
    if (ui.metaTheme) ui.metaTheme.setAttribute('content', t.bg);
    audio.applyTheme(t);
    Storage.set('vibehop_theme', safeIdx);
    renderSelectorsDOM();
    return true;
  }

  // VH-14: Generate 600x750 Neon Cassette Share Card PNG Blob
  function generateShareCardBlob() {
    return new Promise((resolve) => {
      const c = document.createElement('canvas');
      c.width = 600;
      c.height = 750;
      const g = c.getContext('2d');
      const t = THEMES[state.themeIdx];
      const s = Math.floor(state.score);

      g.fillStyle = t.bg;
      g.fillRect(0, 0, 600, 750);

      // Neon border & Cassette Frame
      g.strokeStyle = t.mint;
      g.lineWidth = 6;
      g.strokeRect(28, 28, 544, 694);

      g.fillStyle = t.magenta;
      g.font = '800 20px sans-serif';
      g.textAlign = 'center';
      g.fillText(`📼 VIBEHOP CASSETTE • ${t.name.toUpperCase()}`, 300, 110);

      g.fillStyle = t.mint;
      g.font = '900 74px sans-serif';
      g.fillText(`${s}`, 300, 260);

      g.fillStyle = t.amber;
      g.font = '800 26px sans-serif';
      g.fillText(`PEAK FLOW: ${state.maxMult}x VIBE  •  TAPE LVL ${state.vibeRank}`, 300, 325);

      // Decorative Cassette Reels
      g.strokeStyle = t.amber;
      g.lineWidth = 5;
      [210, 390].forEach((rx) => {
        g.beginPath();
        g.arc(rx, 460, 46, 0, Math.PI * 2);
        g.stroke();
      });

      g.fillStyle = '#ffffff';
      g.font = '700 20px sans-serif';
      g.fillText('bigknoxy.github.io/vibehop', 300, 650);

      c.toBlob((blob) => resolve(blob), 'image/png');
    });
  }

  function resetGame() {
    rng = state.dailyMode ? createMulberry32(getTodaySeedInt()) : Math.random;
    Object.assign(state, {
      mode: 'PLAY', score: 0, mult: 1, maxMult: 1, pips: 3,
      speed: 6.2, distance: 0, nextSpawnDist: 280,
      invulnFrames: 0, shakeFrames: 0, jumpBuffer: 0, coyoteFrames: 6
    });
    ui.pauseBtn.textContent = '⏸️';
    player.x = Math.min(130, Math.max(68, W * 0.22));

  // --- 7. Unified Input & Physics (Variable Jump Arc, Squash/Stretch, Graze) ---
  function triggerPress() {
    audio.init();
    state.holdingInput = true;

    if (state.mode === 'START') { resetGame(); return; }
    if (state.mode === 'PAUSED') { togglePause(); return; }
    if (state.mode === 'OVER') {
      if (state.overLockoutFrames <= 0) resetGame();
      return;
    }

    for (const ring of rings) {
      if (!ring.used && Math.hypot(player.x - ring.x, player.y - ring.y) <= ring.r + player.r * 1.55) {
        ring.used = true;
        player.vy = -8.5;
        player.dashFrames = 16;
        player.scaleX = 1.25;
        player.scaleY = 0.78;
        const onBeat = audio.isOnBeat();
        const pts = (onBeat ? 100 : 50) * state.mult;
        state.score += pts;
        audio.sfxDash();
        triggerHaptic([15, 30, 25]);
        spawnBurst(ring.x, ring.y, COLORS.amber, 22);
        spawnFloatingText(ring.x, ring.y - 24, onBeat ? `⚡ PERFECT DASH +${pts}` : `DASH +${pts}`, COLORS.amber);
        recordMissionProgress('rings', 1);
        if (onBeat) recordMissionProgress('perfects', 1);
        updateHUD();
        return;
      }
    }
    state.jumpBuffer = 6;
  }

  function triggerRelease() {
    state.holdingInput = false;
    // VH-12: Variable Jump Height (releasing early cuts upward velocity for a crisp low-hop)
    if (state.mode === 'PLAY' && player.vy < -5.5 && player.dashFrames <= 0) {
      player.vy *= 0.58;
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (!e.repeat) triggerPress();
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      togglePause();
    } else if (e.code === 'KeyM') {
      setMuted(!state.muted);
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') triggerRelease();
  });
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); triggerPress(); });
  ui.card.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    triggerPress();
  });
  window.addEventListener('pointerup', triggerRelease);

  function executeJump() {
    const onBeat = audio.isOnBeat();
    player.vy = player.jumpForce;
    player.grounded = false;
    player.grinding = false;
    // VH-12: Elastic Takeoff Stretch
    player.scaleX = 0.76;
    player.scaleY = 1.26;
    state.coyoteFrames = 0;
    state.jumpBuffer = 0;
    audio.sfxJump(state.jumpNoteIdx++, onBeat);
    triggerHaptic(12);
    spawnBurst(player.x, player.y + player.r, onBeat ? COLORS.amber : COLORS.mint, onBeat ? 16 : 11);

    if (onBeat) {
      const pts = 50 * state.mult;
      state.score += pts;
      spawnFloatingText(player.x, player.y - 26, `⚡ PERFECT VIBE +${pts}`, COLORS.amber);
      recordMissionProgress('perfects', 1);
    }
  }

  function spawnEntities() {
    if (state.distance < state.nextSpawnDist) return;
    const gap = 300 + rng() * 190;
    state.nextSpawnDist = state.distance + gap;

    const roll = rng();
    const spawnX = W + 80;
    const h = 38 + rng() * 26;
    const w = 34 + rng() * 14;
    obstacles.push({ x: spawnX, y: groundY - h, w, h, shattered: false, grazed: false });

    if (roll > 0.45) {
      const railW = 150 + rng() * 110;
      const railY = groundY - 88 - rng() * 28;
      rails.push({ x: spawnX + 65, y: railY, w: railW, grinded: false });
      orbs.push({ x: spawnX + 65 + railW * 0.5, y: railY - 26, r: 14, collected: false, angle: 0 });
    } else if (roll > 0.2) {
      rings.push({ x: spawnX + (rng() > 0.5 ? 0 : gap * 0.48), y: groundY - 120 - rng() * 45, r: 28, used: false, pulse: 0 });
    }

    if (rng() > 0.35) {
      orbs.push({ x: spawnX + gap * 0.5, y: groundY - 55 - rng() * 90, r: 14, collected: false, angle: 0 });
    }
  }

  function tickParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y += (ft.vy || -1.2) * dt;
      ft.life -= 0.024 * dt;
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
  }

  function update(dt) {
    if (state.mode === 'PAUSED') return;
    if (state.mode === 'OVER') {
      if (state.overLockoutFrames > 0) state.overLockoutFrames -= dt;
      if (state.shakeFrames > 0) state.shakeFrames = Math.max(0, state.shakeFrames - dt);
      tickParticles(dt);
      return;
    }
    if (state.mode !== 'PLAY') return;

    state.speed = Math.min(11.5, 6.2 + state.distance * 0.00018);
    state.maxMult = Math.max(state.maxMult, state.mult);
    const curSpeed = (player.dashFrames > 0 ? state.speed * 1.65 : state.speed) * dt;
    state.distance += curSpeed;
    state.score += (curSpeed * 0.08) * state.mult;

    if (state.invulnFrames > 0) state.invulnFrames = Math.max(0, state.invulnFrames - dt);
    if (state.shakeFrames > 0) state.shakeFrames = Math.max(0, state.shakeFrames - dt);
    if (player.dashFrames > 0) player.dashFrames = Math.max(0, player.dashFrames - dt);

    // Elastic spring back to (1, 1) scale
    player.scaleX += (1 - player.scaleX) * Math.min(1, 0.22 * dt);
    player.scaleY += (1 - player.scaleY) * Math.min(1, 0.22 * dt);

    if (player.grounded || player.grinding) {
      state.coyoteFrames = 6;
      if (state.holdingInput) state.jumpBuffer = 6;
    } else if (state.coyoteFrames > 0) {
      state.coyoteFrames = Math.max(0, state.coyoteFrames - dt);
    }

    if (state.jumpBuffer > 0) {
      state.jumpBuffer = Math.max(0, state.jumpBuffer - dt);
      if (state.coyoteFrames > 0) executeJump();
    }

    const wasGrounded = player.grounded;
    const prevBottom = player.y + player.r;
    player.vy = player.dashFrames > 0 ? player.vy * Math.pow(0.85, dt) : player.vy + player.gravity * dt;
    player.y += player.vy * dt;

    player.grinding = false;
    for (let i = rails.length - 1; i >= 0; i--) {
      const rl = rails[i];
      rl.x -= curSpeed;
      const withinX = player.x >= rl.x - player.r * 0.5 && player.x <= rl.x + rl.w + player.r * 0.5;
      const newBottom = player.y + player.r;
      if (withinX && player.vy >= 0 && prevBottom <= rl.y + 14 && newBottom >= rl.y - 4) {
        player.y = rl.y - player.r;
        player.vy = 0;
        player.grounded = true;
        player.grinding = true;
        state.score += 1.5 * state.mult * dt;
        if (!rl.grinded) {
          rl.grinded = true;
          player.scaleX = 1.24;
          player.scaleY = 0.78;
          recordMissionProgress('rails', 1);
          spawnFloatingText(player.x, rl.y - 28, '⚡ RAIL GRIND!', COLORS.amber);
        }
        if (Math.random() < 0.85) {
          particles.push({
            x: player.x - 6, y: rl.y,
            vx: -state.speed * (0.5 + Math.random() * 0.5), vy: -1 - Math.random() * 2.4,
            r: 2.2 + Math.random() * 2, color: COLORS.amber, life: 0.9, decay: 0.06
          });
        }
      }
      if (rl.x + rl.w < -80) rails.splice(i, 1);
    }

    if (!player.grinding) {
      if (player.y >= groundY - player.r) {
        player.y = groundY - player.r;
        player.vy = 0;
        if (!wasGrounded) {
          // VH-12: Landing Squash
          player.scaleX = 1.26;
          player.scaleY = 0.76;
        }
        player.grounded = true;
      } else {
        player.grounded = false;
      }
    }

    player.rot += player.grinding ? 0 : (curSpeed * 0.045);

    if (Math.random() < 0.65 * dt || player.dashFrames > 0) {
      particles.push({
        x: player.x - player.r * 0.6, y: player.y + (Math.random() - 0.5) * 14,
        vx: -(curSpeed / dt) * 0.4, vy: (Math.random() - 0.5) * 1.2,
        r: player.dashFrames > 0 ? 4.5 : 2.5,
        color: player.dashFrames > 0 ? COLORS.amber : COLORS.mint, life: 1, decay: 0.05
      });
    }

    spawnEntities();

    // Update Obstacles: 70% Inner Lethal Hitbox + Outer 35% Near-Miss Graze Halo
    const hitR = player.r * 0.7;
    const grazeR = player.r * 1.15;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const ob = obstacles[i];
      ob.x -= curSpeed;
      if (!ob.shattered) {
        const rx = ob.x + ob.w * 0.15, ry = ob.y + ob.h * 0.15;
        const cx = Math.max(rx, Math.min(player.x, rx + ob.w * 0.7));
        const cy = Math.max(ry, Math.min(player.y, ry + ob.h * 0.7));
        const distToCore = Math.hypot(player.x - cx, player.y - cy);

        if (distToCore < hitR) {
          ob.shattered = true;
          spawnBurst(ob.x + ob.w / 2, ob.y + ob.h / 2, COLORS.magenta, 24);
          if (!state.zenMode && state.invulnFrames <= 0 && player.dashFrames <= 0) {
            state.pips--;
            state.mult = Math.max(1, state.mult - 1);
            state.invulnFrames = 90;
            state.shakeFrames = prefersReducedMotion ? 0 : 14;
            audio.sfxShieldBreak();
            triggerHaptic(60);
            updateHUD();
            if (state.pips <= 0) {
              state.mode = 'OVER';
              state.overLockoutFrames = 24;
              state.holdingInput = false;
              audio.syncMasterChain();
              showOverlay('OVER');
            }
          }
        } else if (!ob.grazed && distToCore < grazeR) {
          // VH-12: Near-Miss Graze Bonus
          ob.grazed = true;
          const pts = 25 * state.mult;
          state.score += pts;
          audio.sfxGraze();
          triggerHaptic(8);
          spawnBurst(player.x, player.y + player.r * 0.5, COLORS.amber, 8);
          spawnFloatingText(player.x, player.y - 24, `🔥 GRAZE +${pts}`, COLORS.amber);
          recordMissionProgress('graze', 1);
        }
      }
      if (ob.x + ob.w < -60) obstacles.splice(i, 1);
    }

    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.x -= curSpeed;
      rg.pulse += 0.1 * dt;
      if (rg.x + rg.r < -60) rings.splice(i, 1);
    }

    for (let i = orbs.length - 1; i >= 0; i--) {
      const orb = orbs[i];
      orb.x -= curSpeed;
      orb.angle += 0.07 * dt;
      if (!orb.collected && Math.hypot(player.x - orb.x, player.y - orb.y) < player.r + orb.r + 8) {
        orb.collected = true;
        if (state.pips < 3) state.pips++;
        state.mult = Math.min(8, state.mult + 1);
        state.maxMult = Math.max(state.maxMult, state.mult);
        const pts = 100 * state.mult;
        state.score += pts;
        audio.sfxOrb();
        triggerHaptic(18);
        spawnBurst(orb.x, orb.y, COLORS.mint, 18);
        spawnFloatingText(orb.x, orb.y - 18, `+${pts} (${state.mult}x)`, COLORS.mint);
        recordMissionProgress('orbs', 1);
        recordMissionProgress('mult', state.mult, true);
        updateHUD();
      }
      if (orb.x + orb.r < -60 || orb.collected) orbs.splice(i, 1);
    }

    tickParticles(dt);
    updateHUD();
  }

  // --- 8. DRY Canvas Renderer with Visual Beat Ring & Avatar Shapes ---
  function withGlow(color, blur, drawFn) {
    ctx.save();
    ctx.shadowBlur = blur;
    ctx.shadowColor = color;
    drawFn();
    ctx.restore();
  }

  function drawAvatarGeometry(r, activeColor, beatPulse) {
    const shape = AVATARS[state.avatarIdx]?.id || 'cube';
    ctx.strokeStyle = activeColor;
    ctx.lineWidth = 4;

    if (shape === 'vinyl') {
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.52, 0, Math.PI * 1.3);
      ctx.stroke();
    } else if (shape === 'star') {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const rad = i % 2 === 0 ? r * 0.95 : r * 0.42;
        const ang = (i * Math.PI) / 4;
        if (i === 0) ctx.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
        else ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
      }
      ctx.closePath();
      ctx.stroke();
    } else if (shape === 'hex') {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const ang = (i * Math.PI) / 3;
        const x = Math.cos(ang) * r * 0.9;
        const y = Math.sin(ang) * r * 0.9;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    } else {
      ctx.strokeRect(-r * 0.75, -r * 0.75, r * 1.5, r * 1.5);
    }

    ctx.fillStyle = COLORS.amber;
    ctx.beginPath();
    ctx.arc(0, 0, 5 + beatPulse * 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw() {
    ctx.save();
    if (state.shakeFrames > 0 && !prefersReducedMotion) {
      ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
    }

    const beatPhase = audio.getBeatPhase();
    const beatPulse = Math.pow(Math.max(0, 1 - beatPhase * 2.2), 2);

    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    // Layer 1: Distant Gradient Mountains
    const mSpan = 420;
    const mOffset = posMod(state.distance * 0.12, mSpan);
    const grad = ctx.createLinearGradient(0, groundY - 240, 0, groundY);
    grad.addColorStop(0, COLORS.magenta + '2e');
    grad.addColorStop(1, COLORS.bg);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    const mCount = Math.ceil(W / 210) + 3;
    for (let i = -1; i <= mCount; i++) {
      const base = i * 210 - mOffset;
      const worldIdx = Math.floor((state.distance * 0.12 + i * 210) / 210);
      const peakH = 175 + Math.sin(worldIdx * 1.7) * 45 + beatPulse * 6;
      ctx.lineTo(base + 105, groundY - peakH);
      ctx.lineTo(base + 210, groundY);
    }
    ctx.closePath();
    ctx.fill();

    // Layer 2: Beat-Synced Glowing Neon Pillars
    const pSpan = 240;
    const pOffset = posMod(state.distance * 0.32, pSpan);
    withGlow(COLORS.magenta, 12 + beatPulse * 12, () => {
      ctx.strokeStyle = COLORS.magenta;
      ctx.globalAlpha = 0.24 + beatPulse * 0.18;
      ctx.lineWidth = 2;
      const pCount = Math.ceil(W / pSpan) + 2;
      for (let i = -1; i <= pCount; i++) {
        const px = i * pSpan - pOffset;
        const worldPillar = Math.floor((state.distance * 0.32) / pSpan) + i;
        const ph = 95 + posMod(worldPillar * 53, 95) + beatPulse * 10;
        ctx.strokeRect(px, groundY - ph, 26, ph);
      }
    });

    // Layer 3: Ambient Floating Dust Motes
    ctx.fillStyle = COLORS.amber;
    dustMotes.forEach((m) => {
      m.x -= m.s;
      if (m.x < 0) m.x += W;
      ctx.globalAlpha = m.a;
      ctx.beginPath();
      ctx.arc(m.x % W, m.y % groundY, m.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Neon Horizon Line
    withGlow(COLORS.mint, 18 + beatPulse * 14, () => {
      ctx.strokeStyle = COLORS.mint;
      ctx.lineWidth = 3 + beatPulse * 1.5;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(W, groundY);
      ctx.stroke();
    });

    // Elevated Neon Grind Rails
    rails.forEach((rl) =>
      withGlow(COLORS.amber, 18 + beatPulse * 8, () => {
        ctx.strokeStyle = COLORS.amber;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(rl.x, rl.y);
        ctx.lineTo(rl.x + rl.w, rl.y);
        ctx.stroke();
      })
    );

    // Jump Rings
    rings.forEach((rg) => {
      if (rg.used) return;
      withGlow(COLORS.amber, 20 + beatPulse * 12, () => {
        ctx.strokeStyle = COLORS.amber;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(rg.x, rg.y, rg.r + Math.sin(rg.pulse) * 3 + beatPulse * 4, 0, Math.PI * 2);
        ctx.stroke();
      });
    });

    // Collectible Prism Orbs
    orbs.forEach((orb) =>
      withGlow(COLORS.mint, 18, () => {
        ctx.translate(orb.x, orb.y);
        ctx.rotate(orb.angle);
        ctx.fillStyle = COLORS.mint;
        ctx.beginPath();
        ctx.moveTo(0, -orb.r);
        ctx.lineTo(orb.r, 0);
        ctx.lineTo(0, orb.r);
        ctx.lineTo(-orb.r, 0);
        ctx.closePath();
        ctx.fill();
      })
    );

    // Obstacles
    obstacles.forEach((ob) => {
      if (ob.shattered) return;
      withGlow(COLORS.magenta, 20, () => {
        ctx.fillStyle = COLORS.magenta;
        ctx.beginPath();
        ctx.moveTo(ob.x, ob.y + ob.h);
        ctx.lineTo(ob.x + ob.w / 2, ob.y);
        ctx.lineTo(ob.x + ob.w, ob.y + ob.h);
        ctx.closePath();
        ctx.fill();
      });
    });

    // VH-10: Visual Beat Sonar Ring around Avatar (Muted Accessibility)
    const sonarRadius = player.r * (1.1 + (1 - beatPhase) * 1.15);
    ctx.save();
    ctx.globalAlpha = 0.18 + beatPulse * 0.35;
    ctx.strokeStyle = audio.isOnBeat() ? COLORS.amber : COLORS.mint;
    ctx.lineWidth = audio.isOnBeat() ? 2.5 : 1.2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, sonarRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Player Avatar with Elastic Squash & Stretch
    const blink = state.invulnFrames > 0 && Math.floor(state.invulnFrames / 4) % 2 === 0;
    if (!blink) {
      const activeColor = player.dashFrames > 0 || player.grinding ? COLORS.amber : COLORS.mint;
      withGlow(activeColor, 22 + beatPulse * 10, () => {
        ctx.translate(player.x, player.y);
        ctx.scale(player.scaleX, player.scaleY);
        ctx.rotate(player.rot);
        drawAvatarGeometry(player.r, activeColor, beatPulse);
      });
    }

    // Sparkling Particles
    particles.forEach((p) =>
      withGlow(p.color, 12, () => {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      })
    );

    // Floating Beat/Graze/Grind Popups
    floatingTexts.forEach((ft) =>
      withGlow(ft.color, 10, () => {
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.font = '800 13px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
      })
    );

    ctx.restore();
  }

  // Initialize State & UI
  if (state.vibeRank < (THEMES[state.themeIdx]?.unlockRank || 1)) state.themeIdx = 0;
  if (state.vibeRank < (AVATARS[state.avatarIdx]?.unlockRank || 1)) state.avatarIdx = 0;
  setMuted(state.muted);
  selectTheme(state.themeIdx);
  selectAvatar(state.avatarIdx);
  generateMissionsSet(0);
  updateHUD();
  showOverlay('START');

  window.__VIBEHOP__ = {
    THEMES, AVATARS, COLORS, state, player, audio,
    obstacles, rings, orbs, rails, particles, floatingTexts,
    get groundY() { return groundY; },
    setVibeRank, selectTheme, selectAvatar,
    setZenMode, setDailyMode, setMuted, togglePause,
    generateShareCardBlob, spawnFloatingText,
    getMissions: () => activeMissions,
    recordMissionProgress, resetGame, showOverlay,
    triggerPress, triggerRelease, update, draw, updateHUD
  };

  let lastTime = performance.now();
  function loop(now) {
    const rawDt = (now - lastTime) / 16.6667;
    lastTime = now;
    const dt = Math.min(2.5, Math.max(0.1, rawDt));
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

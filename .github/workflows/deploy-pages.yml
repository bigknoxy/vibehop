name: Deploy VibeHop PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate PWA required files & JSON syntax
        run: |
          test -f index.html
          test -f manifest.json
          test -f sw.js
          test -f icon.svg
          test -f og-card.png
          python3 -m json.tool manifest.json > /dev/null
          python3 - <<'PY'
          import struct

          with open('og-card.png', 'rb') as f:
              header = f.read(24)
          assert header[:8] == b'\x89PNG\r\n\x1a\n', 'og-card.png is not a PNG'
          assert header[12:16] == b'IHDR', 'og-card.png IHDR missing'
          width, height = struct.unpack('>II', header[16:24])
          assert (width, height) == (1200, 630), f'og-card.png {width}x{height}, want 1200x630'
          PY
          echo "✅ PWA + OG assets validated successfully."

      - name: Prepare clean _site artifact
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js icon.svg og-card.png _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-stage
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

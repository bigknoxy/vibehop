<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VibeHop">
  <title>VibeHop — Lo-Fi Rhythm Runner</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230d0e1e'/%3E%3Ccircle cx='256' cy='256' r='160' fill='none' stroke='%23ff5376' stroke-width='20' opacity='0.4'/%3E%3Cpolygon points='256,110 380,350 132,350' fill='none' stroke='%234ef0d0' stroke-width='28' stroke-linejoin='round'/%3E%3Ccircle cx='256' cy='275' r='36' fill='%23ffd166'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230d0e1e'/%3E%3Ccircle cx='256' cy='256' r='160' fill='none' stroke='%23ff5376' stroke-width='20' opacity='0.4'/%3E%3Cpolygon points='256,110 380,350 132,350' fill='none' stroke='%234ef0d0' stroke-width='28' stroke-linejoin='round'/%3E%3Ccircle cx='256' cy='275' r='36' fill='%23ffd166'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body {
      width: 100%; height: 100dvh; overflow: hidden;
      background: #0d0e1e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      overscroll-behavior: none;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #ui-layer {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 12px) + 12px) 20px calc(env(safe-area-inset-bottom, 12px) + 14px);
    }
    .hud-top {
      display: flex; justify-content: space-between; align-items: flex-start;
      width: 100%; max-width: 900px; margin: 0 auto;
    }
    .pips-wrap { display: flex; flex-direction: column; gap: 6px; }
    .pips { display: flex; gap: 8px; }
    .pip {
      width: 28px; height: 12px; border-radius: 6px;
      background: rgba(78, 240, 208, 0.12); border: 2px solid rgba(78, 240, 208, 0.55);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .pip.active {
      background: #4ef0d0; border-color: #4ef0d0;
      box-shadow: 0 0 12px rgba(78, 240, 208, 0.85);
      transform: scale(1.04);
    }
    .best-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.55);
    }
    .score-box { text-align: right; }
    .score-val {
      font-size: clamp(24px, 6vw, 32px); font-weight: 800;
      letter-spacing: 1px; line-height: 1.05;
      color: #4ef0d0; text-shadow: 0 0 14px rgba(78, 240, 208, 0.6);
      font-variant-numeric: tabular-nums;
    }
    .mult-val {
      font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
      color: #ffd166; text-shadow: 0 0 10px rgba(255, 209, 102, 0.6);
      margin-top: 2px;
    }
    /* Responsive Center Modal Overlay */
    #overlay-card {
      pointer-events: none;
      align-self: center;
      width: min(92vw, 440px);
      background: rgba(13, 14, 30, 0.84);
      border: 1.5px solid rgba(78, 240, 208, 0.35);
      border-radius: 22px;
      padding: clamp(20px, 5vw, 30px) clamp(16px, 4vw, 26px);
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65), 0 0 28px rgba(78, 240, 208, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    #overlay-card.hidden {
      opacity: 0;
      transform: scale(0.94);
      pointer-events: none;
    }
    .ov-badge {
      display: inline-block;
      font-size: 11px; font-weight: 800; letter-spacing: 1.5px;
      color: #ff5376; background: rgba(255, 83, 118, 0.14);
      border: 1px solid rgba(255, 83, 118, 0.4);
      padding: 4px 10px; border-radius: 999px; margin-bottom: 10px;
    }
    .ov-title {
      font-size: clamp(24px, 7vw, 36px); font-weight: 900;
      letter-spacing: 1px; line-height: 1.12;
      color: #4ef0d0; text-shadow: 0 0 20px rgba(78, 240, 208, 0.65);
      margin-bottom: 8px; word-break: break-word;
    }
    .ov-sub {
      font-size: clamp(13px, 3.6vw, 15px); font-weight: 600;
      line-height: 1.45; color: #ffd166;
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.4);
      margin-bottom: 14px;
    }
    .ov-hints {
      display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
      font-size: 11px; color: rgba(255, 255, 255, 0.72);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 12px;
    }
    .ov-hint-pill {
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 9px; border-radius: 8px;
    }
    .install-bar {
      pointer-events: auto; align-self: center;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      min-height: 10px;
    }
    #install-btn {
      display: none; pointer-events: auto; cursor: pointer;
      background: rgba(13, 14, 30, 0.9); color: #4ef0d0;
      border: 2px solid #4ef0d0; border-radius: 999px;
      padding: 10px 22px; font-size: 14px; font-weight: 700;
      box-shadow: 0 0 18px rgba(78, 240, 208, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    #install-btn:active { transform: scale(0.95); }
    #ios-tip {
      display: none; background: rgba(13, 14, 30, 0.88);
      border: 1px solid rgba(255, 209, 102, 0.5); border-radius: 12px;
      padding: 8px 14px; font-size: 12px; color: #ffd166;
      text-align: center; max-width: 90vw;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui-layer">
    <div class="hud-top">
      <div class="pips-wrap">
        <div class="pips" id="pips">
          <div class="pip active"></div>
          <div class="pip active"></div>
          <div class="pip active"></div>
        </div>
        <div class="best-label" id="best-el">BEST 0000</div>
      </div>
      <div class="score-box">
        <div class="score-val" id="score-el">0000</div>
        <div class="mult-val" id="mult-el">1x VIBE</div>
      </div>
    </div>

    <div id="overlay-card">
      <div class="ov-badge" id="ov-badge">115 BPM LO-FI RUNNER</div>
      <div class="ov-title" id="ov-title">VIBEHOP</div>
      <div class="ov-sub" id="ov-sub">TAP ANYWHERE OR PRESS SPACE TO FLOW</div>
      <div class="ov-hints">
        <span class="ov-hint-pill">⚡ Hold to Auto-Hop</span>
        <span class="ov-hint-pill">⭕ Tap Rings to Dash</span>
        <span class="ov-hint-pill">💎 Orbs Heal +1 Shield</span>
      </div>
    </div>

    <div class="install-bar">
      <button id="install-btn">📲 Install App</button>
      <div id="ios-tip">Tap Share <b>[⎋]</b> → <b>Add to Home Screen</b> for full-screen PWA</div>
    </div>
  </div>

<script>
(() => {
  // --- PWA Registration & Install Prompts ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  let deferredPrompt = null;
  const installBtn = document.getElementById('install-btn');
  const iosTip = document.getElementById('ios-tip');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });

  installBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (isIOS && !isStandalone) {
    iosTip.style.display = 'block';
  }

  // --- Web Audio API: 115 BPM Lo-Fi Synth & Pentatonic SFX ---
  class LoFiAudio {
    constructor() {
      this.ctx = null;
      this.isPlaying = false;
      this.bpm = 115;
      this.stepTime = (60 / this.bpm) / 2; // 8th notes (~0.2608s)
      this.step = 0;
      this.nextNoteTime = 0;
      this.noiseBuffer = null;
      this.pentatonic = [261.63, 311.13, 349.23, 392.00, 466.16, 523.25, 622.25];
      this.chords = [
        [261.63, 311.13, 392.00, 466.16], // Cm7
        [207.65, 261.63, 311.13, 392.00], // Abmaj7
        [174.61, 207.65, 261.63, 349.23], // Fm7
        [196.00, 233.08, 293.66, 349.23]  // Gm7
      ];
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();
        // Pre-generate shared 0.2s white noise buffer for zero-GC percussion
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.2);
        this.noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      if (!this.isPlaying) {
        this.isPlaying = true;
        this.nextNoteTime = this.ctx.currentTime + 0.05;
        this.schedule();
      }
    }

    schedule() {
      if (!this.isPlaying || !this.ctx) return;
      if (document.hidden) {
        this.nextNoteTime = this.ctx.currentTime + 0.1;
      } else {
        // Clamp lag if tab was throttled
        if (this.nextNoteTime < this.ctx.currentTime - 0.25) {
          this.nextNoteTime = this.ctx.currentTime + 0.05;
        }
        while (this.nextNoteTime < this.ctx.currentTime + 0.12) {
          this.playStep(this.step, this.nextNoteTime);
          this.nextNoteTime += this.stepTime;
          this.step = (this.step + 1) % 32;
        }
      }
      setTimeout(() => this.schedule(), 40);
    }

    playStep(step, time) {
      if (step % 8 === 0) {
        const chord = this.chords[Math.floor(step / 8) % this.chords.length];
        chord.forEach((freq) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, time);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(920, time);
          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.032, time + 0.14);
          gain.gain.exponentialRampToValueAtTime(0.0008, time + this.stepTime * 7.8);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(time);
          osc.stop(time + this.stepTime * 8);
        });
      }

      if (step % 8 === 0 || step % 8 === 3 || step % 8 === 4) {
        this.playKick(time);
      }
      if (step % 4 === 2) {
        this.playSnare(time);
      }
      this.playHat(time, step % 2 === 1 ? 0.016 : 0.008);
    }

    playKick(time) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.frequency.setValueAtTime(125, time);
      osc.frequency.exponentialRampToValueAtTime(42, time + 0.12);
      gain.gain.setValueAtTime(0.22, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(time);
      osc.stop(time + 0.19);
    }

    playSnare(time) {
      if (!this.noiseBuffer) return;
      const noise = this.ctx.createBufferSource();
      noise.buffer = this.noiseBuffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1400, time);
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.08, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.09);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(time, 0, 0.09);
    }

    playHat(time, vol) {
      if (!this.noiseBuffer) return;
      const noise = this.ctx.createBufferSource();
      noise.buffer = this.noiseBuffer;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(6500, time);
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(time, 0, 0.035);
    }

    sfxJump(noteIndex = 0) {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const freq = this.pentatonic[noteIndex % this.pentatonic.length];
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.25, now + 0.14);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.17);
    }

    sfxDash() {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      [523.25, 622.25, 783.99].forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + i * 0.035);
        gain.gain.setValueAtTime(0.12, now + i * 0.035);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.035 + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.035);
        osc.stop(now + i * 0.035 + 0.19);
      });
    }

    sfxOrb() {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      [622.25, 932.33].forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now + i * 0.05);
        gain.gain.setValueAtTime(0.14, now + i * 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.05);
        osc.stop(now + i * 0.05 + 0.23);
      });
    }

    sfxShieldBreak() {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.linearRampToValueAtTime(65, now + 0.28);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.31);
    }
  }

  // --- Game Engine & State ---
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score-el');
  const bestEl = document.getElementById('best-el');
  const multEl = document.getElementById('mult-el');
  const pipEls = Array.from(document.querySelectorAll('.pip'));
  const overlayCard = document.getElementById('overlay-card');
  const ovBadge = document.getElementById('ov-badge');
  const ovTitle = document.getElementById('ov-title');
  const ovSub = document.getElementById('ov-sub');

  const COLORS = {
    bg: '#0d0e1e',
    mint: '#4ef0d0',
    magenta: '#ff5376',
    amber: '#ffd166'
  };

  const audio = new LoFiAudio();
  let W = 0, H = 0, DPR = 1, groundY = 0;

  let bestScore = 0;
  try {
    bestScore = parseInt(localStorage.getItem('vibehop_best') || '0', 10) || 0;
  } catch (_) {}

  const state = {
    mode: 'START', // START, PLAY, OVER
    score: 0,
    mult: 1,
    pips: 3,
    speed: 6.2,
    distance: 0,
    nextSpawnDist: 280,
    invulnFrames: 0,
    shakeFrames: 0,
    overLockoutFrames: 0,
    jumpNoteIdx: 0,
    holdingInput: false,
    jumpBuffer: 0,
    coyoteFrames: 0
  };

  const player = {
    x: 0, y: 0, r: 20,
    vy: 0, gravity: 0.68, jumpForce: -13.4,
    dashFrames: 0, rot: 0, grounded: true
  };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    groundY = Math.floor(H * 0.76);
    player.x = Math.min(130, Math.max(68, W * 0.22));
    if (state.mode !== 'PLAY' || player.grounded) {
      player.y = groundY - player.r;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  let obstacles = [];
  let rings = [];
  let orbs = [];
  let particles = [];
  let dustMotes = Array.from({ length: 36 }, () => ({
    x: Math.random() * 1200,
    y: Math.random() * 800,
    r: 1.2 + Math.random() * 2.2,
    s: 0.3 + Math.random() * 0.7,
    a: 0.25 + Math.random() * 0.55
  }));

  function updateHUD() {
    const s = Math.floor(state.score);
    if (s > bestScore) {
      bestScore = s;
      try { localStorage.setItem('vibehop_best', String(bestScore)); } catch (_) {}
    }
    scoreEl.textContent = String(s).padStart(4, '0');
    bestEl.textContent = `BEST ${String(bestScore).padStart(4, '0')}`;
    multEl.textContent = `${state.mult}x VIBE`;
    pipEls.forEach((el, idx) => {
      el.classList.toggle('active', idx < state.pips);
    });
  }

  function showOverlay(mode) {
    if (mode === 'PLAY') {
      overlayCard.classList.add('hidden');
      return;
    }
    overlayCard.classList.remove('hidden');
    if (mode === 'START') {
      ovBadge.textContent = '115 BPM LO-FI RUNNER';
      ovTitle.textContent = 'VIBEHOP';
      ovSub.textContent = 'TAP ANYWHERE OR PRESS SPACE TO FLOW';
    } else if (mode === 'OVER') {
      const s = Math.floor(state.score);
      ovBadge.textContent = s >= bestScore && s > 0 ? '★ NEW HIGH VIBE ★' : 'VIBE CHECK COMPLETE';
      ovTitle.textContent = `SCORE: ${s}`;
      ovSub.textContent = 'TAP ANYWHERE OR PRESS SPACE TO FLOW AGAIN';
    }
  }

  function resetGame() {
    state.mode = 'PLAY';
    state.score = 0;
    state.mult = 1;
    state.pips = 3;
    state.speed = 6.2;
    state.distance = 0;
    state.nextSpawnDist = 280;
    state.invulnFrames = 0;
    state.shakeFrames = 0;
    state.jumpBuffer = 0;
    state.coyoteFrames = 6;
    player.x = Math.min(130, Math.max(68, W * 0.22));
    player.y = groundY - player.r;
    player.vy = 0;
    player.dashFrames = 0;
    player.grounded = true;
    obstacles = [];
    rings = [];
    orbs = [];
    particles = [];
    updateHUD();
    showOverlay('PLAY');
  }

  function spawnBurst(x, y, color, count = 16) {
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const spd = 2 + Math.random() * 6.5;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        r: 2.5 + Math.random() * 3.5,
        color,
        life: 1,
        decay: 0.025 + Math.random() * 0.02
      });
    }
  }

  // --- Input Handling (Spacebar, Up Arrow, Full-Screen Touch/Mouse) ---
  function triggerPress() {
    audio.init();
    state.holdingInput = true;

    if (state.mode === 'START') {
      resetGame();
      return;
    }
    if (state.mode === 'OVER') {
      if (state.overLockoutFrames <= 0) {
        resetGame();
      }
      return;
    }

    // Check if inside or close to a floating Jump Ring for mid-air dash
    for (const ring of rings) {
      if (!ring.used) {
        const dx = player.x - ring.x;
        const dy = player.y - ring.y;
        if (Math.hypot(dx, dy) <= ring.r + player.r * 1.55) {
          ring.used = true;
          player.vy = -8.5;
          player.dashFrames = 16;
          state.score += 50 * state.mult;
          audio.sfxDash();
          spawnBurst(ring.x, ring.y, COLORS.amber, 22);
          updateHUD();
          return;
        }
      }
    }

    // Otherwise buffer a jump (6-frame jump buffer)
    state.jumpBuffer = 6;
  }

  function triggerRelease() {
    state.holdingInput = false;
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (!e.repeat) triggerPress();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      triggerRelease();
    }
  });
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    triggerPress();
  });
  window.addEventListener('pointerup', triggerRelease);
  window.addEventListener('pointercancel', triggerRelease);

  function executeJump(dt) {
    player.vy = player.jumpForce;
    player.grounded = false;
    state.coyoteFrames = 0;
    state.jumpBuffer = 0;
    audio.sfxJump(state.jumpNoteIdx++);
    spawnBurst(player.x, groundY, COLORS.mint, 12);
  }

  // --- Procedural Spawner ---
  function spawnEntities() {
    if (state.distance < state.nextSpawnDist) return;
    const gap = 290 + Math.random() * 195;
    state.nextSpawnDist = state.distance + gap;

    const roll = Math.random();
    const spawnX = W + 80;

    // Obstacle neon spike
    const h = 38 + Math.random() * 26;
    const w = 34 + Math.random() * 14;
    obstacles.push({ x: spawnX, y: groundY - h, w, h, shattered: false });

    // Floating Jump Ring above tall obstacles or mid-gap
    if (roll > 0.38) {
      rings.push({
        x: spawnX + (Math.random() > 0.5 ? 0 : gap * 0.48),
        y: groundY - 120 - Math.random() * 45,
        r: 28,
        used: false,
        pulse: 0
      });
    }

    // Collectible Neon Prism Orb
    if (Math.random() > 0.35) {
      orbs.push({
        x: spawnX + gap * 0.5,
        y: groundY - 55 - Math.random() * 90,
        r: 14,
        collected: false,
        angle: 0
      });
    }
  }

  // --- Main Update Loop (Delta-Time Normalized to 60fps) ---
  function update(dt) {
    if (state.mode === 'OVER') {
      if (state.overLockoutFrames > 0) state.overLockoutFrames -= dt;
      if (state.shakeFrames > 0) state.shakeFrames = Math.max(0, state.shakeFrames - dt);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      return;
    }

    if (state.mode !== 'PLAY') return;

    state.speed = Math.min(11.5, 6.2 + state.distance * 0.00018);
    const curSpeed = (player.dashFrames > 0 ? state.speed * 1.65 : state.speed) * dt;
    state.distance += curSpeed;
    state.score += (curSpeed * 0.08) * state.mult;

    if (state.invulnFrames > 0) state.invulnFrames = Math.max(0, state.invulnFrames - dt);
    if (state.shakeFrames > 0) state.shakeFrames = Math.max(0, state.shakeFrames - dt);
    if (player.dashFrames > 0) player.dashFrames = Math.max(0, player.dashFrames - dt);

    // Coyote time & Jump buffering (6 frames each + Hold-to-auto-jump)
    if (player.grounded) {
      state.coyoteFrames = 6;
      if (state.holdingInput) state.jumpBuffer = 6;
    } else if (state.coyoteFrames > 0) {
      state.coyoteFrames = Math.max(0, state.coyoteFrames - dt);
    }

    if (state.jumpBuffer > 0) {
      state.jumpBuffer = Math.max(0, state.jumpBuffer - dt);
      if (state.coyoteFrames > 0) {
        executeJump(dt);
      }
    }

    // Physics
    if (player.dashFrames > 0) {
      player.vy *= Math.pow(0.85, dt);
    } else {
      player.vy += player.gravity * dt;
    }
    player.y += player.vy * dt;

    if (player.y >= groundY - player.r) {
      player.y = groundY - player.r;
      player.vy = 0;
      player.grounded = true;
    } else {
      player.grounded = false;
    }

    player.rot += (curSpeed * 0.045);

    // Trail particles
    if (Math.random() < 0.65 * dt || player.dashFrames > 0) {
      particles.push({
        x: player.x - player.r * 0.6,
        y: player.y + (Math.random() - 0.5) * 14,
        vx: -(curSpeed / dt) * 0.4,
        vy: (Math.random() - 0.5) * 1.2,
        r: player.dashFrames > 0 ? 4.5 : 2.5,
        color: player.dashFrames > 0 ? COLORS.amber : COLORS.mint,
        life: 1,
        decay: 0.05
      });
    }

    spawnEntities();

    // Update Obstacles & 70% Inner Hitbox Collision
    const hitR = player.r * 0.7;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const ob = obstacles[i];
      ob.x -= curSpeed;
      if (!ob.shattered) {
        const innerPadX = ob.w * 0.15;
        const innerPadY = ob.h * 0.15;
        const rx = ob.x + innerPadX;
        const ry = ob.y + innerPadY;
        const rw = ob.w * 0.7;
        const rh = ob.h * 0.7;

        const cx = Math.max(rx, Math.min(player.x, rx + rw));
        const cy = Math.max(ry, Math.min(player.y, ry + rh));
        if (Math.hypot(player.x - cx, player.y - cy) < hitR) {
          ob.shattered = true;
          spawnBurst(ob.x + ob.w / 2, ob.y + ob.h / 2, COLORS.magenta, 24);
          if (state.invulnFrames <= 0 && player.dashFrames <= 0) {
            state.pips--;
            state.mult = Math.max(1, state.mult - 1);
            state.invulnFrames = 90; // 1.5s at 60fps
            state.shakeFrames = 14;
            audio.sfxShieldBreak();
            updateHUD();
            if (state.pips <= 0) {
              state.mode = 'OVER';
              state.overLockoutFrames = 24; // 0.4s lockout prevents accidental tap-through
              state.holdingInput = false;
              showOverlay('OVER');
            }
          }
        }
      }
      if (ob.x + ob.w < -60) obstacles.splice(i, 1);
    }

    // Update Jump Rings
    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.x -= curSpeed;
      rg.pulse += 0.1 * dt;
      if (rg.x + rg.r < -60) rings.splice(i, 1);
    }

    // Update Collectible Prism Orbs
    for (let i = orbs.length - 1; i >= 0; i--) {
      const orb = orbs[i];
      orb.x -= curSpeed;
      orb.angle += 0.07 * dt;
      if (!orb.collected && Math.hypot(player.x - orb.x, player.y - orb.y) < player.r + orb.r + 8) {
        orb.collected = true;
        if (state.pips < 3) state.pips++;
        state.mult = Math.min(8, state.mult + 1);
        state.score += 100 * state.mult;
        audio.sfxOrb();
        spawnBurst(orb.x, orb.y, COLORS.mint, 18);
        updateHUD();
      }
      if (orb.x + orb.r < -60 || orb.collected) orbs.splice(i, 1);
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    updateHUD();
  }

  // --- Lo-Fi Neon Glow Renderer (3-Layer Parallax) ---
  function draw() {
    ctx.save();
    if (state.shakeFrames > 0) {
      ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
    }

    // Deep night background
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    // Layer 1: Distant Gradient Mountains (positive wrap)
    const mSpan = 420;
    const mOffset = ((state.distance * 0.12) % mSpan + mSpan) % mSpan;
    const grad = ctx.createLinearGradient(0, groundY - 240, 0, groundY);
    grad.addColorStop(0, 'rgba(255, 83, 118, 0.16)');
    grad.addColorStop(1, 'rgba(13, 14, 30, 0.95)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    const mCount = Math.ceil(W / 210) + 3;
    for (let i = -1; i <= mCount; i++) {
      const base = i * 210 - mOffset;
      const worldIdx = Math.floor((state.distance * 0.12 + i * 210) / 210);
      const peakH = 175 + Math.sin(worldIdx * 1.7) * 45;
      ctx.lineTo(base + 105, groundY - peakH);
      ctx.lineTo(base + 210, groundY);
    }
    ctx.closePath();
    ctx.fill();

    // Layer 2: Glowing Neon Pillars (positive modulo height)
    const pSpan = 240;
    const pOffset = ((state.distance * 0.32) % pSpan + pSpan) % pSpan;
    ctx.save();
    ctx.shadowBlur = 14;
    ctx.shadowColor = COLORS.magenta;
    ctx.strokeStyle = 'rgba(255, 83, 118, 0.25)';
    ctx.lineWidth = 2;
    const pCount = Math.ceil(W / pSpan) + 2;
    for (let i = -1; i <= pCount; i++) {
      const px = i * pSpan - pOffset;
      const worldPillar = Math.floor((state.distance * 0.32) / pSpan) + i;
      const ph = 95 + (((worldPillar * 53) % 95 + 95) % 95);
      ctx.strokeRect(px, groundY - ph, 26, ph);
    }
    ctx.restore();

    // Layer 3: Ambient Floating Dust Motes
    ctx.fillStyle = COLORS.amber;
    dustMotes.forEach((m) => {
      m.x -= m.s;
      if (m.x < 0) m.x += W;
      ctx.globalAlpha = m.a;
      ctx.beginPath();
      ctx.arc(m.x % W, m.y % groundY, m.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Neon Horizon Line
    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = COLORS.mint;
    ctx.strokeStyle = COLORS.mint;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
    ctx.restore();

    // Jump Rings
    rings.forEach((rg) => {
      if (rg.used) return;
      ctx.save();
      ctx.shadowBlur = 20;
      ctx.shadowColor = COLORS.amber;
      ctx.strokeStyle = COLORS.amber;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(rg.x, rg.y, rg.r + Math.sin(rg.pulse) * 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });

    // Collectible Prism Orbs
    orbs.forEach((orb) => {
      ctx.save();
      ctx.translate(orb.x, orb.y);
      ctx.rotate(orb.angle);
      ctx.shadowBlur = 18;
      ctx.shadowColor = COLORS.mint;
      ctx.fillStyle = COLORS.mint;
      ctx.beginPath();
      ctx.moveTo(0, -orb.r);
      ctx.lineTo(orb.r, 0);
      ctx.lineTo(0, orb.r);
      ctx.lineTo(-orb.r, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // Obstacles
    obstacles.forEach((ob) => {
      if (ob.shattered) return;
      ctx.save();
      ctx.shadowBlur = 20;
      ctx.shadowColor = COLORS.magenta;
      ctx.fillStyle = COLORS.magenta;
      ctx.beginPath();
      ctx.moveTo(ob.x, ob.y + ob.h);
      ctx.lineTo(ob.x + ob.w / 2, ob.y);
      ctx.lineTo(ob.x + ob.w, ob.y + ob.h);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });

    // Player Avatar
    const blink = state.invulnFrames > 0 && Math.floor(state.invulnFrames / 4) % 2 === 0;
    if (!blink) {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.rot);
      ctx.shadowBlur = 24;
      ctx.shadowColor = player.dashFrames > 0 ? COLORS.amber : COLORS.mint;
      ctx.strokeStyle = player.dashFrames > 0 ? COLORS.amber : COLORS.mint;
      ctx.lineWidth = 4;
      ctx.strokeRect(-player.r * 0.75, -player.r * 0.75, player.r * 1.5, player.r * 1.5);
      ctx.fillStyle = COLORS.amber;
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Sparkling Particles
    particles.forEach((p) => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.shadowBlur = 12;
      ctx.shadowColor = p.color;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    ctx.restore();
  }

  updateHUD();
  showOverlay('START');

  let lastTime = performance.now();
  function loop(now) {
    const rawDt = (now - lastTime) / 16.6667;
    lastTime = now;
    const dt = Math.min(2.5, Math.max(0.1, rawDt));
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
